# Full stack: Postgres, worker, API, and UI. `docker-compose.yml` (dev) starts
# only Postgres; this file runs everything from the built images.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai}
      POSTGRES_DB: ${POSTGRES_DB:-ai_system}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ai} -d ${POSTGRES_DB:-ai_system}']
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai}:${POSTGRES_PASSWORD:-ai}@postgres:5432/${POSTGRES_DB:-ai_system}
      AI_DATA_DIR: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CODING_EXECUTOR: ${CODING_EXECUTOR:-api_loop}
      TASK_CONCURRENCY: ${TASK_CONCURRENCY:-4}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - workdata:/data
    depends_on:
      postgres: { condition: service_healthy }
    # Horizontal scaling: workers are stateless and pull from pg-boss, so
    # `--scale worker=N` is the whole story (docs/01 §6).
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['node', 'apps/api/dist/main.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai}:${POSTGRES_PASSWORD:-ai}@postgres:5432/${POSTGRES_DB:-ai_system}
      API_PORT: 3001
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
      JIRA_WEBHOOK_ORG_ID: ${JIRA_WEBHOOK_ORG_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '3001:3001'
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      API_URL: http://api:3001
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  workdata:
